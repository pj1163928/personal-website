{% extends 'base.html' %}

{% block content %}
<h1>Home</h1>
<p>This is the home page.</p>

<h2>My Current Tasks</h2>
<ul>
    {% for item in items %}
        <li>
            {{ item.name }} -
            {% if item.completed %}
                Completed
            {% else %}
                In progress
            {% endif %}
        </li>
    {% endfor %}
</ul>
{% endblock %}
